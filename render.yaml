services:
  - type: web
    name: smart-study-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: STUDY_APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-study-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: smart-study-ai-db
    plan: free
